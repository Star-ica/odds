<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Market · Odds</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet"><style>:root{--font:"Space Grotesk";--bg:#f5f1fd;--surface:#fff;--ink:#25134a;--mute:#6d5d8c;--line:#ddd2f2;--soft:#ebe4fa;--brand:#5b2bd0;--on-brand:#fff;--accent:#5b2bd0;--good:#0f8a6d;--bad:#d6336c}
@media(prefers-color-scheme:dark){:root{--bg:#171028;--surface:#221840;--ink:#efe8ff;--mute:#a899c9;--line:#3a2b61;--soft:#2c2050;--brand:#a98bff;--on-brand:#1a1030;--accent:#a98bff;--good:#3ddcae;--bad:#ff6b9b}}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 var(--font),system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit}h1,h2,h3{font-family:var(--head,var(--font)),system-ui,sans-serif}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:20px;height:64px}
.logo{font-weight:800;font-size:1.2rem;text-decoration:none;letter-spacing:-.02em;display:flex;align-items:center;gap:9px}
.logo i{width:22px;height:22px;border-radius:6px;background:var(--brand);display:inline-block}
nav{display:flex;gap:4px;margin-left:auto;overflow-x:auto}
nav a{padding:8px 12px;border-radius:8px;text-decoration:none;color:var(--mute);font-weight:600;font-size:.95rem;white-space:nowrap}
nav a:hover,nav a[aria-current]{color:var(--ink);background:var(--soft)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:inherit;font-weight:600;padding:11px 18px;border-radius:10px;border:1.5px solid var(--brand);background:var(--brand);color:var(--on-brand);cursor:pointer;text-decoration:none}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}.btn.ghost:hover{border-color:var(--brand)}
.btn.sm{padding:8px 14px;font-size:.9rem}.btn.yes{background:var(--good);border-color:var(--good);color:#fff}.btn.no{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.hero{padding:72px 0 56px;display:grid;grid-template-columns:1.1fr .9fr;gap:48px;align-items:center}
h1{font-size:clamp(2.3rem,6vw,4rem);line-height:1.03;letter-spacing:-.035em;margin:14px 0 18px;font-weight:800}
h2{font-size:clamp(1.6rem,3.5vw,2.2rem);letter-spacing:-.02em;margin:0 0 12px;line-height:1.15}
.lede{font-size:1.15rem;color:var(--mute);max-width:46ch;margin:0}
.cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
section.band{padding:64px 0;border-top:1px solid var(--line)}
.stats{display:flex;gap:48px;flex-wrap:wrap}.stats b{display:block;font-size:2.2rem;letter-spacing:-.02em;line-height:1.1}.stats span{color:var(--mute);font-size:.9rem}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:28px;margin:28px 0 0;list-style:none;padding:0;counter-reset:s}
.steps li{counter-increment:s;border-top:3px solid var(--brand);padding-top:12px}
.steps li::before{content:counter(s);font-weight:800;color:var(--brand);font-size:1.2rem}
.steps h3{margin:2px 0 6px;font-size:1.1rem}.steps p{margin:0;color:var(--mute)}
.page{padding:40px 0 80px}.page h1{font-size:clamp(2rem,5vw,3rem);margin-top:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px}
.panel h3{margin:0 0 4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
a.card{display:block;text-decoration:none;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;transition:border-color .15s,transform .15s}
a.card:hover{border-color:var(--brand);transform:translateY(-2px)}a.card h3{margin:10px 0 4px;font-size:1.15rem;line-height:1.3}
.meta{color:var(--mute);font-size:.88rem;overflow-wrap:anywhere}
.pill{display:inline-block;font-size:.78rem;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--soft);color:var(--ink)}
.pill.ok{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}.pill.bad{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
label{display:block;font-weight:600;font-size:.9rem;margin:16px 0 6px}
input,select,textarea{font:inherit;color:inherit;width:100%;padding:11px 13px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg)}
.hint{color:var(--mute);font-size:.85rem;margin-top:5px}
.two{display:grid;grid-template-columns:1.4fr 1fr;gap:24px;align-items:start}
.bar{height:10px;background:var(--soft);border-radius:99px;overflow:hidden;margin:10px 0 6px}.bar i{display:block;height:100%;background:var(--fill,var(--brand))}
.tabs{display:flex;gap:6px;margin:22px 0;flex-wrap:wrap}
.tabs button{font:inherit;font-weight:600;padding:8px 16px;border-radius:99px;border:1.5px solid var(--line);background:transparent;color:var(--mute);cursor:pointer}
.tabs button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.ms{list-style:none;margin:16px 0 0;padding:0}
.ms li{display:flex;justify-content:space-between;gap:16px;padding:12px 0 12px 16px;border-left:3px solid var(--line);align-items:center}
.ms li.done{border-color:var(--good)}.ms li.now{border-color:var(--accent)}
.mrow{display:grid;grid-template-columns:1fr 90px 44px;gap:8px;margin-bottom:8px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}
.stack>*+*{margin-top:14px}
.empty{padding:48px 0;text-align:center;color:var(--mute)}
.notice{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin:16px 0 0;font-size:.92rem}
code{background:var(--soft);padding:1px 6px;border-radius:5px;font-size:.9em}
pre{background:var(--ink);color:var(--bg);padding:16px;border-radius:12px;overflow-x:auto;font-size:.88rem;margin:0}
footer{border-top:1px solid var(--line);padding:32px 0;color:var(--mute);font-size:.9rem}
footer .wrap{display:flex;justify-content:space-between;gap:32px;flex-wrap:wrap}
.fcol{display:flex;flex-direction:column;gap:6px}.fcol b,footer b{color:var(--ink)}footer a{text-decoration:none}footer a:hover{color:var(--ink);text-decoration:underline}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;max-width:90vw;transition:.2s;z-index:50;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}#toast.err{background:var(--bad);color:#fff}#toast.ok{background:var(--good);color:#fff}
@media(max-width:820px){.hero,.two{grid-template-columns:1fr}.hero{padding-top:36px}.top .wrap{height:auto;padding:10px 20px;flex-wrap:wrap;gap:10px}nav{order:3;width:100%;margin:0}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
.odds{display:flex;height:40px;border-radius:10px;overflow:hidden;font-weight:700;margin:14px 0 8px}
.odds span{display:flex;align-items:center;padding:0 12px;min-width:48px;transition:width .4s}
.odds .y{background:var(--good);color:#04231b}.odds .n{background:var(--bad);color:#fff;justify-content:flex-end}
.big{font-size:clamp(1.6rem,4vw,2.4rem);letter-spacing:-.03em;line-height:1.15;margin:12px 0}
</style></head><body>
<header class="top"><div class="wrap"><a class="logo" href="index.html"><i></i>Odds</a><nav aria-label="Main"><a href="index.html">Home</a><a href="markets.html">Markets</a><a href="create.html">Open a market</a></nav><button class="btn sm" id="connect">Connect wallet</button></div></header>
<main><div class="wrap page" id="view"><p class="empty">Loading…</p></div></main>
<footer><div class="wrap"><div><b>Odds</b><br>Demo contracts, unaudited.<br>Running on BOT Chain testnet (chain ID 968).</div>
<div class="fcol"><b>Pages</b><a href="index.html">Home</a><a href="markets.html">Markets</a><a href="create.html">Open a market</a></div>
<div class="fcol"><b>BOT Chain</b><a href="http://botchain.ai" target="_blank" rel="noopener noreferrer">Website</a><a href="http://scan.bohr.life" target="_blank" rel="noopener noreferrer">Block explorer</a><a id="fcontract" href="#" target="_blank" rel="noopener noreferrer" hidden>This contract on explorer</a></div></div></footer>
<script src="https://cdn.jsdelivr.net/npm/ethers@6.13.4/dist/ethers.umd.min.js"></script><script>window.ethers||document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.13.4/ethers.umd.min.js"><\/script>')</script><script>// Network settings for BOT Chain testnet. The contract address is entered on the site itself.
window.CONFIG={address:"",rpc:"https://rpc.bohr.life",explorer:"https://scan.bohr.life",chainId:968,chainName:"BOT Chain Testnet",symbol:"BOT",
abi:["function marketCount() view returns (uint256)",
"function getMarket(uint256) view returns (string question,uint64 closeTime,address resolver,uint256 yesPool,uint256 noPool,uint8 state,bool outcome)",
"function yesStake(uint256,address) view returns (uint256)","function noStake(uint256,address) view returns (uint256)","function claimed(uint256,address) view returns (bool)",
"function createMarket(string,uint64,address) returns (uint256)","function bet(uint256,bool) payable","function resolve(uint256,bool)","function claim(uint256)"]};
const STATE=['Open','Awaiting result','Resolved','Void'];
function yesPct(m){const t=m.yesPool+m.noPool;return t>0n?Number(m.yesPool*100n/t):50}
function oddsBar(m){const y=yesPct(m);return `<div class="odds" role="img" aria-label="YES ${y}%, NO ${100-y}%"><span class="y" style="width:${y}%">YES ${y}%</span><span class="n" style="width:${100-y}%">${100-y}%</span></div>`}
function statePill(m){const s=Number(m.state);return `<span class="pill ${s==2?'ok':s==3?'bad':''}">${STATE[s]}${s==2?': '+(m.outcome?'YES':'NO'):''}</span>`}</script><script>if(!window.ethers){document.addEventListener('DOMContentLoaded',()=>document.body.insertAdjacentHTML('afterbegin','<p style="padding:14px 20px;margin:0;background:#b3392f;color:#fff;font:600 15px system-ui">The wallet library failed to load. Check your internet connection and reload the page.</p>'));throw new Error('ethers not loaded')}
const E=window.ethers,$=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const CFG=window.CONFIG;
try{const q=new URLSearchParams(location.search).get('contract');if(q&&/^0x[0-9a-fA-F]{40}$/.test(q))localStorage.setItem('contract',q);const sv=localStorage.getItem('contract');if(sv)CFG.address=sv}catch{}
const esc=s=>String(s).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
const short=a=>a.slice(0,6)+'…'+a.slice(-4);
const eth=v=>{const n=Number(E.formatEther(v));return n>=1000?n.toFixed(0):String(+n.toPrecision(4))};
function toast(m,k){let t=$('#toast');if(!t){t=document.createElement('div');t.id='toast';t.setAttribute('role','status');document.body.append(t)}
 t.textContent=m;t.className='show '+(k||'');clearTimeout(toast.h);if(k!=='busy')toast.h=setTimeout(()=>t.className='',k==='err'?10000:5000)}
const HEX='0x'+CFG.chainId.toString(16);
const App={me:null,signer:null,_r:null,chainOk:false,
 ready(){return E.isAddress(CFG.address)},
 reader(){if(!this.ready())return null;if(!this._r){const p=CFG.rpc?new E.JsonRpcProvider(CFG.rpc):window.ethereum?new E.BrowserProvider(window.ethereum):null;if(!p)return null;this._r=new E.Contract(CFG.address,CFG.abi,p)}return this._r},
 async ensureChain(){
  const w=window.ethereum,is=async()=>parseInt(await w.request({method:'eth_chainId'}),16)===CFG.chainId;
  if(await is())return true;
  try{await w.request({method:'wallet_switchEthereumChain',params:[{chainId:HEX}]})}
  catch(e){
   if(e.code===4001){toast('Network switch was rejected. Please switch to '+CFG.chainName+' (chain ID '+CFG.chainId+').','err');return false}
   try{await w.request({method:'wallet_addEthereumChain',params:[{chainId:HEX,chainName:CFG.chainName,nativeCurrency:{name:CFG.symbol,symbol:CFG.symbol,decimals:18},rpcUrls:[CFG.rpc],blockExplorerUrls:[CFG.explorer]}]})}
   catch(e2){console.error(e2);toast('Could not add '+CFG.chainName+' ('+(e2.message||e2.code)+'). Add it manually in your wallet: RPC '+CFG.rpc+', chain ID '+CFG.chainId+', symbol '+CFG.symbol+'.','err');return false}
  }
  return await is()},
 async connect(quiet){
  const w=window.ethereum;
  if(!w){if(!quiet)toast(location.protocol==='file:'?'No wallet detected. Wallet extensions cannot see pages opened as local files. Host the folder (for example on Vercel or with “npx serve”) or enable “Allow access to file URLs” for your wallet extension. On a phone, open this site inside your wallet’s built-in browser.':'No wallet detected. Install MetaMask, or open this site inside your wallet’s built-in browser.','err');return null}
  try{
   const a=await w.request({method:quiet?'eth_accounts':'eth_requestAccounts'});
   if(!a.length)return null;
   if(!quiet)await this.ensureChain();
   this.signer=await new E.BrowserProvider(w).getSigner();this.me=await this.signer.getAddress();await this.paint();return this.me
  }catch(e){console.error(e);if(!quiet)toast(e.code===4001?'Connection request was rejected in your wallet.':e.code===-32002?'A wallet request is already pending. Open your wallet and approve it.':(e.shortMessage||e.message||'Could not connect.'),'err');return null}},
 async paint(){
  let ok=false;if(this.me&&window.ethereum){try{ok=parseInt(await window.ethereum.request({method:'eth_chainId'}),16)===CFG.chainId}catch{}}
  this.chainOk=ok;const b=$('#connect');
  if(b){b.textContent=!this.me?'Connect wallet':ok?short(this.me):'Wrong network: switch';b.title=this.me||''}
  document.dispatchEvent(new Event('wallet'))},
 async tx(fn,done){try{
  if(!this.ready()){toast('Link your contract address first (box at the top of the page).','err');return}
  if(!this.signer&&!await this.connect())return;
  if(!await this.ensureChain())return;
  this.signer=await new E.BrowserProvider(window.ethereum).getSigner();
  const c=new E.Contract(CFG.address,CFG.abi,this.signer);toast('Confirm in your wallet…','busy');
  const t=await fn(c);toast('Waiting for confirmation…','busy');await t.wait();toast('Confirmed.','ok');if(done)done();return true
 }catch(e){console.error(e);toast(e.code===4001||e.code==='ACTION_REJECTED'?'Transaction rejected in your wallet.':(e.shortMessage||e.reason||e.message),'err')}}};
const onWallet=fn=>document.addEventListener('wallet',fn);
document.addEventListener('DOMContentLoaded',async()=>{
 $('#connect').onclick=async()=>{if(App.me&&!App.chainOk){await App.ensureChain();return App.paint()}App.connect()};
 if(!App.ready()){$('main').insertAdjacentHTML('afterbegin','<div class="wrap"><form class="notice" id="setup"><b>Link your contract.</b> Deploy it, then paste the address here (saved in this browser).<div class="row"><input id="caddr" placeholder="0x…" aria-label="Contract address" style="flex:1;min-width:220px"><button class="btn sm">Save</button></div></form></div>');
  $('#setup').onsubmit=e=>{e.preventDefault();const v=$('#caddr').value.trim();if(!E.isAddress(v))return toast('That is not a valid address.','err');try{localStorage.setItem('contract',v)}catch{}location.reload()}}
 if(App.ready()){const a=$('#fcontract');if(a){a.href=CFG.explorer+'/address/'+CFG.address;a.hidden=false}}
 if(window.ethereum){
  window.ethereum.on?.('accountsChanged',()=>location.reload());window.ethereum.on?.('chainChanged',()=>location.reload());
  try{const a=await window.ethereum.request({method:'eth_accounts'});if(a.length)await App.connect(true)}catch{}}
 App.paint()});
</script>
<script>const id=+new URLSearchParams(location.search).get('id');let M;
async function render(){const c=App.reader(),box=$('#view');
 if(!c){box.innerHTML='<p class="empty">Contract not configured yet.</p>';return}
 try{M=await c.getMarket(id)}catch{box.innerHTML='<p class="empty">Market not found. <a href="markets.html">Back to markets</a></p>';return}
 const m=M,s=Number(m.state);let ys=0n,ns=0n,done=false;
 if(App.me)[ys,ns,done]=await Promise.all([c.yesStake(id,App.me),c.noStake(id,App.me),c.claimed(id,App.me)]);
 const isR=App.me&&m.resolver.toLowerCase()==App.me.toLowerCase();let act='';
 if(s==0)act=`<label for="amt">Amount (BOT)</label><input id="amt" inputmode="decimal" placeholder="0.05"><div class="hint" id="est">Enter an amount to see your potential return.</div>
  <div class="row"><button class="btn yes" data-a="yes">Bet YES</button><button class="btn no" data-a="no">Bet NO</button></div>`;
 else if(s==1)act=isR?`<p class="meta">You are the resolver. Report what happened.</p><div class="row"><button class="btn yes" data-a="rY">YES happened</button><button class="btn no" data-a="rN">NO happened</button></div>`:'<p class="meta">Betting is closed. Waiting for the resolver to report the outcome.</p>';
 else if(!done&&(ys+ns>0n))act='<div class="row"><button class="btn" data-a="claim">Claim winnings</button></div><p class="hint">If you backed the losing side the claim pays nothing.</p>';
 else act='<p class="meta">Nothing to claim.</p>';
 box.innerHTML=`<a class="meta" href="markets.html">← All markets</a><div class="two" style="margin-top:14px"><div>${statePill(m)}<h1 class="big" style="margin-top:14px">${esc(m.question)}</h1>
 <div class="panel">${oddsBar(m)}<div class="meta">Pool <b>${eth(m.yesPool+m.noPool)} BOT</b> · YES ${eth(m.yesPool)} · NO ${eth(m.noPool)}</div>
 <p class="meta" style="margin-bottom:0">Closes ${new Date(Number(m.closeTime)*1000).toLocaleString()}<br>Resolver ${m.resolver}</p></div></div>
 <div class="panel"><h3>Trade</h3>${ys+ns>0n?`<p class="meta">Your stake: ${eth(ys)} YES · ${eth(ns)} NO</p>`:''}${act}</div></div>`}
document.addEventListener('input',e=>{if(e.target.id!='amt')return;const a=+e.target.value,y=+E.formatEther(M.yesPool),n=+E.formatEther(M.noPool),t=y+n+a;
 $('#est').textContent=a>0?`If YES wins you would receive about ${(a*t*.98/(y+a)).toPrecision(3)} BOT. If NO wins, about ${(a*t*.98/(n+a)).toPrecision(3)} BOT. Odds move as others bet.`:'Enter an amount to see your potential return.'});
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;
 const v=()=>{const x=$('#amt').value;if(!(+x>0)){toast('Enter an amount in BOT.','err');return null}return E.parseEther(x)};
 if(a=='yes'||a=='no'){const x=v();if(x)App.tx(c=>c.bet(id,a=='yes',{value:x}),render)}
 if(a=='rY')App.tx(c=>c.resolve(id,true),render);if(a=='rN')App.tx(c=>c.resolve(id,false),render);if(a=='claim')App.tx(c=>c.claim(id),render)});
onWallet(render)</script></body></html>
